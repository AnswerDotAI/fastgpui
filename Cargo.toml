[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "fastgpui"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Drive GPUI apps from Python, as fastcdp drives Chrome"
repository = "https://github.com/AnswerDotAI/fastgpui"

[lib]
name = "fastgpui"

[dependencies]
base64 = "0.22"
gpui-kit = { version = "0.9.1", features = ["test-support"] }
serde_json = "1.0.154"

[[example]]
name = "counter"
test = true

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.fastgpui]
incremental = true

[profile.release.package.fastgpui-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.fastgpui]
incremental = false

[profile.dist.package.fastgpui-py]
incremental = false
